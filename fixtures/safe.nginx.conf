# fixtures/safe.nginx.conf
# Demonstrates patterns that do NOT trigger CVE-2026-42945.
# Reasons why each location is safe are noted inline.

worker_processes 1;
events { worker_connections 1024; }

http {
    server {
        listen 80;
        server_name example.com;

        # --- Safe: named captures used instead of unnamed ($1) ---
        location /api/ {
            # Uses (?<action>\w+) named capture -> $action (not $1)
            # No unnamed capture references; heap-length miscalculation not triggered
            rewrite ^/api/(?<action>\w+)$ /new-api?path=$action last;
            rewrite ^/api/(?<rest>.*)$    /fallback last;
        }

        # --- Safe: unnamed capture present but NO '?' in replacement ---
        location /clean-redirect/ {
            # $1 is used but replacement has no '?', so the is_args mismatch
            # that causes the overflow cannot occur
            rewrite ^/clean-redirect/(\w+)$ /target/$1 last;
            rewrite ^/clean-redirect/(.*)$  /home last;
        }

        # --- Safe: '?' present but NO unnamed capture reference ---
        location /search/ {
            # Literal query string, no PCRE capture variable
            rewrite ^/search/(.*)$ /results?source=web last;
        }

        # --- Safe: single rewrite with unnamed capture + '?' but NO following directive ---
        # The CVE requires a *subsequent* rewrite/if/set in the same scope to overflow.
        location /solo/ {
            rewrite ^/solo/(\w+)$ /dest?key=$1 last;
        }

        # --- Safe: fixed NGINX version (informational comment only) ---
        # nginx/1.31.0 is the fixed mainline release per advisory
    }
}
