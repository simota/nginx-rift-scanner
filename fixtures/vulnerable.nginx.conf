# fixtures/vulnerable.nginx.conf
# Demonstrates the CVE-2026-42945 trigger pattern:
#   - rewrite using unnamed PCRE capture ($1) with '?' in replacement
#   - followed by another rewrite/if/set directive in the same scope block
#
# This is a HEURISTIC fixture for scanner validation only.
# Do NOT deploy this configuration.

worker_processes 1;
events { worker_connections 1024; }

http {
    server {
        listen 80;
        server_name example.com;

        # --- Vulnerable scope A ---
        # Pattern: unnamed capture ($1) + '?' in replacement + another directive follows
        location /api/ {
            # (a) unnamed PCRE capture: (\w+) -> $1
            # (b) replacement contains '?': /new-api?path=$1
            # (c) followed by another rewrite directive in same scope
            rewrite ^/api/(\w+)$ /new-api?path=$1 last;
            rewrite ^/api/(.*)$  /fallback last;
        }

        # --- Vulnerable scope B ---
        # Uses 'set' directive with unnamed capture reference + '?' then another directive
        location /search/ {
            if ($request_uri ~* ^/search/(\w+)) {
                set $target "/results?q=$1";
                rewrite ^ $target redirect;
            }
        }

        # --- Vulnerable scope C: rewrite chain ---
        location /redirect/ {
            rewrite ^/redirect/(\d+)/(.*)$ /page?id=$1&slug=$2 permanent;
            rewrite ^/redirect/(.*)$ /page?fallback=$1 last;
        }
    }
}
